<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제자의 삶 디지털 교재</title>
<meta name="theme-color" content="#1f5a3d">
<meta name="description" content="제자의 삶 디지털 교재">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제삶">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <button type="button" class="icon-btn only-tab" id="btn-nav" aria-label="목차 열기">☰</button>
  <div class="brand"><b>제자의 삶</b><span class="brand-sub" id="top-lesson"></span></div>
  <div class="top-actions">
    <button type="button" class="chip-btn" id="btn-orig" aria-pressed="false">원본 보기</button>
    <div class="fs" role="group" aria-label="글자 크기">
      <button type="button" class="icon-btn" id="fs-dn" aria-label="글자 작게">가<small>−</small></button>
      <button type="button" class="icon-btn" id="fs-up" aria-label="글자 크게">가<small>+</small></button>
    </div>
    <button type="button" class="chip-btn only-mid" id="btn-panel" aria-pressed="false">노트·자료</button>
  </div>
</header>

<div class="shell">
  <aside id="nav" aria-label="목차와 검색">
    <div class="sheet-head only-mob"><b id="nav-title">목차</b><button type="button" class="icon-btn" data-close aria-label="닫기">✕</button></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="교재 · 내 메모 검색" autocomplete="off"></label>
    <div class="scope" id="scope">
      <button type="button" data-s="all" class="on">전체</button><button type="button" data-s="lesson">이 과</button><button type="button" data-s="mine">내 메모·답</button>
    </div>
    <div id="results" hidden></div>
    <ol id="toc"></ol>
    <div class="acct">
      <span id="acct-name"></span>
      <span class="grow"></span>
      <button type="button" class="acct-btn" id="btn-admin" hidden>교재 올리기</button>
      <button type="button" class="acct-btn" id="btn-logout" hidden>로그아웃</button>
    </div>
  </aside>

  <main id="reader" tabindex="-1"></main>

  <aside id="panel" aria-label="노트와 자료">
    <div class="sheet-head only-mob"><b id="panel-title">내 노트</b><button type="button" class="icon-btn" data-close aria-label="닫기">✕</button></div>
    <div class="ptabs" role="tablist">
      <button type="button" data-p="notes" class="on" role="tab">내 노트</button>
      <button type="button" data-p="files" role="tab">자료</button>
      <button type="button" data-p="orig" role="tab">원본</button>
    </div>
    <section data-pp="notes" id="notes"></section>
    <section data-pp="files" id="files" hidden></section>
    <section data-pp="orig" id="orig" hidden>
      <div class="orig-bar">
        <button type="button" class="icon-btn" id="pg-prev" aria-label="이전 쪽">‹</button>
        <b id="pg-label">-</b>
        <button type="button" class="icon-btn" id="pg-next" aria-label="다음 쪽">›</button>
        <span class="grow"></span>
        <label class="follow"><input type="checkbox" id="pg-follow" checked> 읽는 곳 따라가기</label>
        <button type="button" class="icon-btn" id="pg-zoom" aria-label="확대">⤢</button>
      </div>
      <div class="orig-view" id="orig-view"><img id="pg-img" alt="원본 교재 페이지"></div>
    </section>
  </aside>
</div>

<nav id="tabbar" class="only-mob" aria-label="하단 메뉴">
  <button type="button" data-tab="toc"><i>☰</i>목차</button>
  <button type="button" data-tab="read" class="on"><i>◉</i>읽기</button>
  <button type="button" data-tab="search"><i>⌕</i>검색</button>
  <button type="button" data-tab="notes"><i>✎</i>내 노트</button>
</nav>

<div id="hlbar" role="toolbar" aria-label="형광펜 도구" hidden>
  <span class="hl-main">
    <button type="button" class="sw y" data-c="y" aria-label="노랑 형광펜"></button>
    <button type="button" class="sw g" data-c="g" aria-label="초록 형광펜"></button>
    <button type="button" class="sw p" data-c="p" aria-label="분홍 형광펜"></button>
    <button type="button" class="sw b" data-c="b" aria-label="파랑 형광펜"></button>
    <span class="sep"></span>
    <button type="button" class="u" data-c="u">밑줄</button>
    <button type="button" id="hl-memo">메모</button>
  </span>
  <span class="hl-memo" hidden>
    <input id="hl-memo-in" type="text" placeholder="메모 입력 후 Enter">
    <button type="button" id="hl-memo-ok">저장</button>
  </span>
  <span class="hl-edit" hidden>
    <button type="button" id="hl-note-edit">메모 수정</button>
    <button type="button" id="hl-del">지우기</button>
  </span>
</div>

<div id="modal" class="modal" hidden>
  <form class="modal-box" id="att-form">
    <h3>자료 추가</h3>
    <p class="muted" id="att-target"></p>
    <div class="seg" id="att-kind">
      <button type="button" data-k="note" class="on">보충 설명</button><button type="button" data-k="link">링크</button><button type="button" data-k="image">사진</button>
    </div>
    <label>제목<input id="att-title" type="text" required placeholder="예: 영적 훈련 보충 설명"></label>
    <label data-for="note">내용<textarea id="att-text" rows="5" placeholder="본문과 구분된 상자로 표시됩니다"></textarea></label>
    <label data-for="link" hidden>주소<input id="att-url" type="url" placeholder="https://"></label>
    <label data-for="image" hidden>사진 파일<input id="att-file" type="file" accept="image/*"></label>
    <div class="modal-act"><button type="button" class="ghost" id="att-cancel">취소</button><button type="submit" class="primary">추가</button></div>
  </form>
</div>

<div id="upl" class="modal" hidden>
  <div class="modal-box wide">
    <h3>교재 올리기</h3>
    <p class="muted">받은 <b>교재데이터</b> 폴더를 통째로 아래 칸에 끌어다 놓으세요. 이미 올린 과를 다시 올리면 새 내용으로 바뀝니다. 내 형광펜·메모는 그대로 남습니다.</p>
    <div id="upl-drop" class="drop">
      <b>여기에 폴더를 끌어다 놓기</b>
      <span class="muted">또는</span>
      <div class="drop-btns">
        <label class="ghost">폴더 선택<input type="file" id="upl-dir" webkitdirectory multiple hidden></label>
        <label class="ghost">파일 선택<input type="file" id="upl-files" multiple accept=".json,.webp" hidden></label>
      </div>
    </div>
    <p class="upl-sum" id="upl-sum"></p>
    <ul id="upl-list" class="upl-list"></ul>
    <div class="modal-act"><button type="button" class="ghost" id="upl-close">닫기</button><button type="button" class="primary" id="upl-go" disabled>올리기</button></div>
  </div>
</div>

<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-logo">제자의 삶</div>
    <p class="gate-sub">예수님을 사랑함으로 좇아가는 삶</p>
    <div data-g="loading"><p class="muted">불러오는 중…</p></div>
    <div data-g="out" hidden>
      <button type="button" class="primary big" id="btn-login">Google 계정으로 로그인</button>
      <p class="muted small">등록된 사람만 교재를 볼 수 있습니다.</p>
    </div>
    <div data-g="nomember" hidden>
      <p><b id="g-name"></b> 님은 아직 등록되지 않았습니다.</p>
      <p class="muted small">관리자에게 아래 UID를 보내 등록을 요청하세요.</p>
      <code id="g-uid"></code>
      <div class="gate-act"><button type="button" class="primary" id="btn-copy-uid">UID 복사</button><button type="button" class="ghost" id="btn-logout2">다른 계정으로 로그인</button></div>
    </div>
    <div data-g="error" hidden><p id="g-err"></p><button type="button" class="ghost" onclick="location.reload()">새로고침</button></div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden><img alt=""><button type="button" class="icon-btn" aria-label="닫기">✕</button></div>
<div id="toast" role="status" hidden></div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
